[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ungem5"
version = "0.26.10.2"
description = "Everything gem5 research needs that is not the simulator: builds, runs, a lab scheduler, and typed statistics."
license = { text = "MIT" }
authors = [{ name = "Mahyar Samani", email = "msamani@ucdavis.edu" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "flask",
    "gitpython",
    "prompt_toolkit",
    "psutil",
    "rpyc>=6",
    "werkzeug",
]

[project.optional-dependencies]
dev = ["pytest"]
# NOTE: The learned memory estimate (ungem5/schedule/model.py).
model = ["scikit-learn"]

[project.urls]
Homepage = "https://github.com/mahyarsamani/experiment"

[project.scripts]
helper = "ungem5.cli.helper:main_function"

[tool.setuptools.packages.find]
include = ["ungem5*"]

[tool.setuptools.package-data]
"ungem5.jobs" = ["assets/*.py"]
"ungem5.schedule" = ["templates/*.html", "static/*.css"]
